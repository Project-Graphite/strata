services:
  app:
    build:
      target: development
    command: [sh, -c, 'npm run prisma:migrate:deploy && exec npm run dev']
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      EMAIL_HOST: mailpit
      EMAIL_PORT: '1025'
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./app
      target: development
    command: npm run dev --workspace frontend -- --host 0.0.0.0
    environment:
      VITE_API_ORIGIN: http://app:3000
    ports:
      - '4104:5173'
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - app

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '4125:8025'
