name: PR

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: Detect
    uses: project-graphite/actions/.github/workflows/reusable-detect-services.yml@main

  checks:
    name: Checks
    needs: services
    uses: project-graphite/actions/.github/workflows/reusable-checks.yml@main
    with:
      services: ${{ needs.services.outputs.services }}

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://strata:strata@localhost:5432/strata
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - name: Schema matches migrations
        working-directory: app/server
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:integration --workspace server
      - name: A backup restores into an empty database
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES" pg_dump -U strata -Fc -f /tmp/strata.dump strata
          docker exec "$POSTGRES" pg_restore --list /tmp/strata.dump > /dev/null
          docker exec "$POSTGRES" createdb -U strata strata_restored
          docker exec "$POSTGRES" pg_restore -U strata --exit-on-error --no-owner -d strata_restored /tmp/strata.dump
          rows() {
            docker exec "$POSTGRES" psql -U strata -d "$1" -Atc "select table_name || '=' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I', table_name), false, true, '')))[1]::text from information_schema.tables where table_schema = 'public' order by table_name"
          }
          diff <(rows strata) <(rows strata_restored)
          test "$(rows strata_restored | wc -l)" -gt 40

  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build --workspace frontend
      - run: npm run check:bundle --workspace frontend

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        name: Detect Android changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^app/frontend/android/|^app/frontend/capacitor\.config\.ts$|^app/frontend/src/native-capture\.ts$'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - if: steps.changes.outputs.android == 'true'
        name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - if: steps.changes.outputs.android == 'true'
        name: Sync Capacitor
        working-directory: app
        run: |
          npm ci
          npm run android:build --workspace frontend

      - if: steps.changes.outputs.android == 'true'
        name: Build both APK flavours
        working-directory: app/frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assemblePlayRelease assembleSideloadRelease --no-daemon
          ls -l app/build/outputs/apk/*/release/*.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump permissions app/build/outputs/apk/play/release/app-play-release.apk | tee "$RUNNER_TEMP/play-permissions.txt"
          "$aapt2" dump permissions app/build/outputs/apk/sideload/release/app-sideload-release.apk | tee "$RUNNER_TEMP/sideload-permissions.txt"
          if grep -q READ_SMS "$RUNNER_TEMP/play-permissions.txt"; then
            echo "::error::The Play flavour must not ask for READ_SMS."
            exit 1
          fi
          grep -q READ_SMS "$RUNNER_TEMP/sideload-permissions.txt"

      - if: steps.changes.outputs.android == 'true'
        name: Inspect release build (temporary)
        working-directory: app/frontend/android
        run: |
          map=app/build/outputs/mapping/sideloadRelease/mapping.txt
          apk=app/build/outputs/apk/sideload/release/app-sideload-release.apk
          grep -E "^(com\.projectgraphite\.strata\.|com\.getcapacitor\.(MessageHandler|Bridge|BridgeActivity|Plugin|annotation\.CapacitorPlugin|PluginMethod) |androidx\.work\.impl\.background\.systemjob\.SystemJobService |androidx\.work\.impl\.WorkManagerInitializer )" "$map" || true
          grep -o -E " -> (postMessage|getStatus|configure|scanNotifications|backfillInbox|flushOutbox|retryRejected|requestSmsAccess|openNotificationSettings|onNotificationPosted|onListenerConnected|onListenerDisconnected|doWork)$" "$map" | sort | uniq -c || true
          awk '/^com\.getcapacitor\.MessageHandler /{f=1;next} /^[^ ]/{f=0} f' "$map" | grep postMessage | head -3 || true
          grep -n -B1 -A2 "JavascriptInterface" app/build/intermediates/default_proguard_files/global/proguard-android-optimize.txt-* || true
          grep -A30 -E "^com\.projectgraphite\.strata\.StrataCapturePlugin " "$map" || true
          grep -A6 -E "^com\.projectgraphite\.strata\.CaptureUploadWorker " "$map" || true
          unzip -l "$apk" | sort -k1 -n -r | head -25
          unzip -l "$apk" | grep -c "assets/public/" || true
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -E -A3 "E: (service|meta-data|receiver|provider|uses-feature)"
          cat app/build/outputs/mapping/sideloadRelease/missing_rules.txt 2>/dev/null || true

      - if: steps.changes.outputs.android == 'true'
        name: Lint both flavours
        working-directory: app/frontend/android
        run: ./gradlew lintPlayRelease lintSideloadRelease --no-daemon --continue || { cat app/build/reports/lint-results-*.txt; exit 1; }

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target server app

  secrets:
    name: Secrets
    uses: project-graphite/actions/.github/workflows/reusable-gitleaks.yml@main

  conventions:
    name: Conventions
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: project-graphite/actions/.github/workflows/reusable-pr-checks.yml@main
