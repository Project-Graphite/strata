name: PR

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: Detect
    uses: project-graphite/actions/.github/workflows/reusable-detect-services.yml@main

  checks:
    name: Checks
    needs: services
    uses: project-graphite/actions/.github/workflows/reusable-checks.yml@main
    with:
      services: ${{ needs.services.outputs.services }}

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://strata:strata@localhost:5432/strata
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - name: Schema matches migrations
        working-directory: app/server
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:integration --workspace server
      - name: A backup restores into an empty database
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES" pg_dump -U strata -Fc -f /tmp/strata.dump strata
          docker exec "$POSTGRES" pg_restore --list /tmp/strata.dump > /dev/null
          docker exec "$POSTGRES" createdb -U strata strata_restored
          docker exec "$POSTGRES" pg_restore -U strata --exit-on-error --no-owner -d strata_restored /tmp/strata.dump
          rows() {
            docker exec "$POSTGRES" psql -U strata -d "$1" -Atc "select table_name || '=' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I', table_name), false, true, '')))[1]::text from information_schema.tables where table_schema = 'public' order by table_name"
          }
          diff <(rows strata) <(rows strata_restored)
          test "$(rows strata_restored | wc -l)" -gt 40

  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build --workspace frontend
      - run: npm run check:bundle --workspace frontend

  ui-changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^app/(frontend|server)/'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  ui-quality:
    name: Lighthouse and axe
    needs: ui-changes
    if: needs.ui-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://strata:strata@localhost:5432/strata
      REDIS_URL: redis://localhost:6379
      AUTH_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-for-lighthouse
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      DATA_ENCRYPTION_KEY: c3RyYXRhLWNpLWxpZ2h0aG91c2UtYW5kLWF4ZS1rZXk=
      APP_URL: http://localhost:3000
      DEFAULT_FROM_EMAIL: Strata <strata@localhost>
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      SHOTS_URL: http://localhost:3000
      SHOTS_EMAIL: ui-check@example.com
      SHOTS_PASSWORD: ui-check-password-only-for-ci
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:migrate:deploy
      - run: npm run build
      - name: Start the API serving the production frontend
        run: |
          nohup node server/dist/main.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 60); do
            curl -fs http://localhost:3000/api/v1/ready > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Create a verified test account with every app turned on
        run: |
          api=http://localhost:3000/api/v1
          json=(-fsS -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000')
          curl "${json[@]}" -X POST "$api/auth/register" -d "{\"email\":\"$SHOTS_EMAIL\",\"handle\":\"ui-check\",\"displayName\":\"UI Check\",\"password\":\"$SHOTS_PASSWORD\"}"
          token=$(curl -fsS http://localhost:8025/api/v1/message/latest | grep -oE 'token=[A-Za-z0-9_-]+' | head -n 1 | cut -d= -f2)
          curl "${json[@]}" -X POST "$api/auth/verify-email" -d "{\"token\":\"$token\"}"
          access=$(curl "${json[@]}" -X POST "$api/auth/login" -d "{\"email\":\"$SHOTS_EMAIL\",\"password\":\"$SHOTS_PASSWORD\"}" | jq -r .accessToken)
          curl "${json[@]}" -X PATCH "$api/me" -H "Authorization: Bearer $access" -d '{"features":["tasks","agenda","pages","boards","bookmarks","journal","files","spending","goals","people","recipes","tidy","trips"]}'
      - run: npm run audit:ui --workspace frontend
      - if: ${{ !cancelled() }}
        run: npm run lighthouse --workspace frontend
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: app/frontend/.lighthouseci
          include-hidden-files: true
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        name: Detect Android changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^app/frontend/android/|^app/frontend/src/native-capture\.ts$'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - if: steps.changes.outputs.android == 'true'
        name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - if: steps.changes.outputs.android == 'true'
        name: Build web assets and sync Capacitor
        working-directory: app
        run: |
          npm ci
          npm run android:build --workspace frontend

      - if: steps.changes.outputs.android == 'true'
        name: Build both APK flavours
        working-directory: app/frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assemblePlayRelease assembleSideloadRelease --no-daemon
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump permissions app/build/outputs/apk/play/release/app-play-release.apk > "$RUNNER_TEMP/play-permissions.txt"
          "$aapt2" dump permissions app/build/outputs/apk/sideload/release/app-sideload-release.apk > "$RUNNER_TEMP/sideload-permissions.txt"
          if grep -q READ_SMS "$RUNNER_TEMP/play-permissions.txt"; then
            echo "::error::The Play flavour must not ask for READ_SMS."
            exit 1
          fi
          grep -q READ_SMS "$RUNNER_TEMP/sideload-permissions.txt"

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target server app

  secrets:
    name: Secrets
    uses: project-graphite/actions/.github/workflows/reusable-gitleaks.yml@main

  conventions:
    name: Conventions
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: project-graphite/actions/.github/workflows/reusable-pr-checks.yml@main
