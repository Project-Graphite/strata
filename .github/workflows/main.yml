name: Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  services:
    name: Detect
    uses: project-graphite/actions/.github/workflows/reusable-detect-services.yml@main
    with:
      all: true

  checks:
    name: Checks
    needs: services
    uses: project-graphite/actions/.github/workflows/reusable-checks.yml@main
    with:
      services: ${{ needs.services.outputs.services }}

  images:
    name: Images
    needs: [services, checks]
    permissions:
      contents: read
      packages: write
    uses: project-graphite/actions/.github/workflows/reusable-docker-build-push.yml@main
    with:
      services: ${{ needs.services.outputs.services }}
  deploy:
    name: Deploy to Coolify
    needs: images
    if: ${{ vars.GRAPHITE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl --fail --show-error --silent --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
  secrets:
    name: Secrets
    uses: project-graphite/actions/.github/workflows/reusable-gitleaks.yml@main
