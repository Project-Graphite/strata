name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (defaults to the latest v* tag)
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Resolve release version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            git checkout "$tag"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release tag found to publish."
            exit 1
          fi
          version="${tag#v}"
          IFS='.' read -r major minor patch _ <<< "${version%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-1} ))
          if [ "$code" -lt 1 ]; then
            code=1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - id: changes
        name: Check for Android changes since the previous release
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$previous" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$previous" "$TAG" -- app/frontend/android app/frontend/capacitor.config.ts \
            || git diff "$previous" "$TAG" -- app/frontend/package.json | grep -q '^[+-].*"@capacitor/'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "No Android changes since $previous; this release ships without an APK."
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.android == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Accept Android SDK licenses
        if: steps.changes.outputs.android == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build web assets and sync Capacitor
        if: steps.changes.outputs.android == 'true'
        working-directory: app
        run: |
          npm ci
          npm run android:build --workspace frontend

      - name: Build signed Android APK
        if: steps.changes.outputs.android == 'true'
        working-directory: app/frontend/android
        env:
          STRATA_VERSION_NAME: ${{ steps.version.outputs.version }}
          STRATA_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/strata-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/strata-release.jks"
          fi
          chmod +x gradlew
          ./gradlew assembleSideloadRelease --no-daemon
          rm -f "$RUNNER_TEMP/strata-release.jks"
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "$RUNNER_TEMP/strata.apk"
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "$RUNNER_TEMP/strata-${STRATA_VERSION_NAME}.apk"

      - uses: actions/attest-build-provenance@v4
        if: steps.changes.outputs.android == 'true'
        with:
          subject-path: ${{ runner.temp }}/strata.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ runner.temp }}/strata.apk
          VERSIONED_APK: ${{ runner.temp }}/strata-${{ steps.version.outputs.version }}.apk
          ANDROID: ${{ steps.changes.outputs.android }}
        run: |
          set -euo pipefail
          if [ "$ANDROID" = "true" ]; then
            assets=("$APK" "$VERSIONED_APK")
            latest=--latest
          else
            assets=()
            latest=--latest=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
            fi
            gh release edit "$TAG" --draft=false "$latest"
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Strata $TAG" \
              --generate-notes \
              "$latest"
          fi
