name: strata

services:
  app:
    image: ghcr.io/project-graphite/strata/app:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://strata:${POSTGRES_PASSWORD:?}@postgres:5432/strata
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?}
      AUTH_TRUSTED_ORIGINS: https://strata.project-graphite.com
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      APP_URL: https://strata.project-graphite.com
      EMAIL_HOST: ${EMAIL_HOST:?}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    volumes:
      - files-data:/data/files
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:3000/api/v1/health]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  postgres:
    image: postgres:18-alpine
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, max_connections=40]
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U strata -d strata]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 320M

  redis:
    image: redis:8.10-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  backup:
    image: postgres:18-alpine
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -Fc -f "/backups/strata-$$stamp.dump.partial"
          pg_restore --list "/backups/strata-$$stamp.dump.partial" > /dev/null
          mv "/backups/strata-$$stamp.dump.partial" "/backups/strata-$$stamp.dump"
          tar -czf "/backups/files-$$stamp.tar.gz" -C /data files
          find /backups -type f -mtime "+$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    environment:
      PGHOST: postgres
      PGUSER: strata
      PGDATABASE: strata
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - backups:/backups
      - files-data:/data/files:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  backups:
  files-data:
  postgres-data:
  redis-data:
